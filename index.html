<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AfterWork Garage - Lacak Dokumentasi Servis Motor</title>
  <style>
    :root {
      --bg: #121214;
      --card: #1c1c20;
      --line: #2b2b31;
      --tx: #f4f1ea;
      --mut: #9b99a3;
      --ac: #ff7a1a;
      --ok: #3ecf8e;
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    html { background: #000; }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .pad { padding: 16px; }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--ac);
      display: grid;
      place-items: center;
      font-size: 22px;
      user-select: none;
      box-shadow: 0 4px 12px rgba(255, 122, 26, 0.25);
    }
    header b { display: block; font-size: 18px; }
    header small { color: var(--mut); font-size: 12px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .hero {
      background: linear-gradient(160deg, #2a1a0d, #1c1c20 65%);
      border-color: #4a2b12;
    }
    h2 { font-size: 17px; margin: 0 0 6px; }
    .sub { color: var(--mut); font-size: 13px; margin: 0 0 14px; }

    input#platInput {
      width: 100%;
      background: #121214;
      color: var(--tx);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      font-family: inherit;
    }
    input#platInput:focus {
      outline: none;
      border-color: var(--ac);
    }

    .btn {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font: inherit;
      font-weight: 700;
      background: var(--ac);
      color: #1a0c00;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      margin-top: 12px;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.85; }

    .btn-pdf {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      margin-top: 10px;
      border: none;
      cursor: pointer;
    }
    .btn-pdf:hover { background: #1d4ed8; }

    .plate-badge {
      display: inline-block;
      background: #f4f1ea;
      color: #111;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .history-item {
      background: #121214;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }
    .history-item .tag {
      display: inline-block;
      background: #2a1a0d;
      color: var(--ac);
      border: 1px solid #4a2b12;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .history-item .date {
      color: var(--mut);
      font-size: 12px;
    }
    .history-item .note {
      color: #d1d5db;
      font-size: 13px;
      margin-top: 6px;
      white-space: pre-wrap;
    }

    .empty-state {
      text-align: center;
      padding: 24px 12px;
      color: var(--mut);
    }
    .empty-state .icon {
      font-size: 44px;
      margin-bottom: 8px;
    }

    footer {
      text-align: center;
      color: var(--mut);
      font-size: 12px;
      padding: 16px;
      border-top: 1px solid var(--line);
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🏍️</div>
  <div>
    <b>AfterWork Garage</b>
    <small>Cek Status &amp; Dokumentasi Servis Motor</small>
  </div>
</header>

<div class="pad">
  <div class="card hero">
    <h2>Lacak Dokumentasi Motor</h2>
    <p class="sub">Masukkan nomor plat motor untuk melihat riwayat servis &amp; mengunduh laporan PDF.</p>
    <label for="platInput" style="display:none">Plat Nomor</label>
    <input id="platInput" placeholder="B 1234 XYZ" autocomplete="off">
    <button class="btn" id="btnCari">Cari Dokumentasi</button>
  </div>

  <div id="resultArea"></div>
</div>

<footer>© AfterWork Garage · Dokumentasi Servis Digital</footer>

<script>
  // URL Web App Google Apps Script Anda
  const API_URL = "https://script.google.com/macros/s/AKfycbyV7DavSysWDsmQP1oZUiNhrnqthpQ0MLxiH0r9AvaTI7PpPnX-Xo3ymyqa5zXMpzEX/exec";

  const platInput = document.getElementById("platInput");
  const btnCari = document.getElementById("btnCari");
  const resultArea = document.getElementById("resultArea");

  // Auto format plat nomor ke huruf besar
  platInput.addEventListener("input", () => {
    platInput.value = platInput.value.toUpperCase();
  });

  platInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") searchMotor();
  });

  btnCari.addEventListener("click", searchMotor);

  async function searchMotor() {
    const rawVal = platInput.value.trim();
    const cleanPlat = rawVal.toUpperCase().replace(/[^A-Z0-9]/g, "");

    if (!cleanPlat) {
      alert("Silakan masukkan nomor plat motor terlebih dahulu.");
      platInput.focus();
      return;
    }

    resultArea.innerHTML = `
      <div class="card empty-state">
        <div class="icon">⏳</div>
        <h2>Mencari Data...</h2>
        <p class="sub">Mengambil data riwayat &amp; dokumentasi untuk plat ${formatPlat(cleanPlat)}</p>
      </div>
    `;

    try {
      const resp = await fetch(API_URL + "?plat=" + encodeURIComponent(cleanPlat));
      const data = await resp.json();

      if (data && data.ok && data.riwayat && data.riwayat.length > 0) {
        renderResults(data, cleanPlat);
      } else {
        renderNotFound(cleanPlat);
      }
    } catch (err) {
      console.error(err);
      renderError();
    }
  }

  function renderResults(data, cleanPlat) {
    const m = data.motor || {};
    const riwayat = data.riwayat || [];

    let html = `
      <div class="card">
        <div class="plate-badge">${escapeHtml(m.plat || formatPlat(cleanPlat))}</div>
        <div style="font-size: 15px; font-weight: 700; color: #ffffff;">
          ${escapeHtml(m.pelanggan ? 'Pemilik: ' + m.pelanggan : 'Motor ' + (m.tipe || ''))}
        </div>
        ${m.tipe ? `<div style="font-size: 13px; color: var(--mut); margin-top:2px;">Model: ${escapeHtml(m.tipe)}</div>` : ''}

        <h3 style="font-size: 15px; margin-top: 18px; margin-bottom: 8px; color: var(--ac);">
          📋 Riwayat &amp; File Dokumentasi (${riwayat.length})
        </h3>
    `;

    // Render riwayat terbaru paling atas
    riwayat.reverse().forEach((item, index) => {
      html += `
        <div class="history-item">
          <div class="tag">${escapeHtml(item.s || 'Servis Motor')}</div>
          <div class="date">📅 Tanggal: ${escapeHtml(item.t || '-')}</div>
          ${item.c ? `<div class="note">💬 Catatan: ${escapeHtml(item.c)}</div>` : ''}

          ${item.pdfUrl ? `
            <a href="${escapeHtml(item.pdfUrl)}" target="_blank" rel="noopener" class="btn-pdf">
              📄 Unduh / Lihat Laporan PDF
            </a>
          ` : `
            <div style="font-size: 12px; color: var(--mut); margin-top: 8px; font-style: italic;">
              File PDF belum diunggah.
            </div>
          `}
        </div>
      `;
    });

    html += `</div>`;
    resultArea.innerHTML = html;
  }

  function renderNotFound(plat) {
    resultArea.innerHTML = `
      <div class="card empty-state">
        <div class="icon">🔍</div>
        <h2>Dokumentasi Belum Ditemukan</h2>
        <p class="sub">Belum ada riwayat servis / file PDF tersimpan untuk plat <b>${escapeHtml(formatPlat(plat))}</b>.</p>
      </div>
    `;
  }

  function renderError() {
    resultArea.innerHTML = `
      <div class="card empty-state">
        <div class="icon">⚠️</div>
        <h2>Gagal Terhubung</h2>
        <p class="sub">Periksa koneksi internet Anda atau pastikan URL Google Apps Script sudah benar.</p>
      </div>
    `;
  }

  function formatPlat(s) {
    const clean = s.toUpperCase().replace(/[^A-Z0-9]/g, "");
    const match = clean.match(/^([A-Z]{1,2})(\d{1,4})([A-Z]{0,3})$/);
    return match ? [match[1], match[2], match[3]].filter(Boolean).join(" ") : clean;
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));
  }
</script>

</body>
</html>
